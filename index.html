<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Natalia & Sławek — nasze zdjęcia</title>
  <meta name="description" content="Wspólna galeria zdjęć. Dodaj swoje zdjęcia i zobacz zdjęcia innych.">
  <style>
    :root{--glass:rgba(18,18,18,.58);--line:rgba(255,255,255,.22)}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;
      min-height:100vh;background:#111}
    body:before{content:"";position:fixed;inset:0;background:
      linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.68)),
      url("background.jpg") center/cover no-repeat;z-index:-2}
    body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:-1}
    .wrap{max-width:1050px;margin:auto;padding:24px 16px 48px}
    .hero{text-align:center;padding:30px 10px 22px}
    h1{font-size:clamp(34px,8vw,64px);margin:0 0 8px;font-weight:700;letter-spacing:-1px}
    .sub{font-size:16px;opacity:.9}
    .card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.28)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    button,.filebtn{border:0;border-radius:999px;padding:13px 18px;font-size:16px;font-weight:650;cursor:pointer}
    .primary{background:#fff;color:#111}.secondary{background:rgba(255,255,255,.14);color:#fff;border:1px solid var(--line)}
    input[type=file]{display:none}
    #status{margin:14px 0 0;text-align:center;opacity:.9;min-height:24px}
    .qrbox{display:none;text-align:center;margin-top:18px}
    #qrcode{background:#fff;display:inline-block;padding:12px;border-radius:16px}
    .hint{font-size:13px;opacity:.75;margin-top:10px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:18px}
    .gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:15px;display:block;background:#222}
    .empty{text-align:center;opacity:.8;padding:35px 10px}
    footer{text-align:center;opacity:.7;font-size:12px;margin-top:18px}
    @media(max-width:520px){.wrap{padding:10px 10px 30px}.hero{padding-top:22px}.card{padding:14px}.gallery{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Natalia &amp; Sławek</h1>
      <div class="sub">07.07.2027 • wspólna galeria zdjęć</div>
    </section>

    <section class="card">
      <div class="actions">
        <label class="filebtn primary" for="file">＋ Dodaj zdjęcie</label>
        <button class="secondary" id="refresh">↻ Odśwież</button>
        <button class="secondary" id="showqr">▣ Pokaż QR</button>
      </div>
      <input id="file" type="file" accept="image/*" multiple>
      <div id="status">Ładowanie zdjęć…</div>

      <div class="qrbox" id="qrbox">
        <div id="qrcode"></div>
        <div class="hint">Zeskanuj ten kod, aby otworzyć tę galerię.</div>
      </div>

      <div class="gallery" id="gallery"></div>
      <div class="empty" id="empty" style="display:none">Nie ma jeszcze zdjęć. Dodaj pierwsze 📸</div>
    </section>
    <footer>Wspólna galeria • zdjęcia są przechowywane w Twoim projekcie Supabase</footer>
  </main>

  <!-- Replace these two values with your Supabase project values. -->
  <script>
    const SUPABASE_URL = "https://uedyjeuxegrwosclzyjr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7g2A0-9QNztdcJxDJeLXyA_utkkSqpu";
    const BUCKET = "photos";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const configured = !SUPABASE_URL.startsWith("WKLEJ_") && !SUPABASE_ANON_KEY.startsWith("WKLEJ_");
    const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    const gallery = document.getElementById("gallery");
    const empty = document.getElementById("empty");
    const status = document.getElementById("status");

    function setStatus(t){ status.textContent=t; }
    function escapePath(name){ return name.replace(/[^a-zA-Z0-9._-]/g,"_"); }

    async function loadPhotos(){
      if(!configured){
        setStatus("Strona jest gotowa. Najpierw wpisz dane Supabase w kodzie.");
        empty.style.display="block"; empty.textContent="Skonfiguruj Supabase zgodnie z instrukcją w README.";
        return;
      }
      setStatus("Ładowanie zdjęć…");
      gallery.innerHTML="";
      const {data, error} = await sb.storage.from(BUCKET).list("", {limit:1000, sortBy:{column:"created_at",order:"desc"}});
      if(error){ setStatus("Nie udało się pobrać zdjęć."); return; }
      const files = (data||[]).filter(x=>x.name);
      empty.style.display = files.length ? "none" : "block";
      for(const f of files){
        const {data:urlData} = sb.storage.from(BUCKET).getPublicUrl(f.name);
        if(urlData?.publicUrl){
          const im=document.createElement("img");
          im.loading="lazy"; im.alt="Zdjęcie"; im.src=urlData.publicUrl;
          im.onclick=()=>window.open(urlData.publicUrl,"_blank");
          gallery.appendChild(im);
        }
      }
      setStatus(`${files.length} ${files.length===1?"zdjęcie":(files.length<5?"zdjęcia":"zdjęć")}`);
    }

    document.getElementById("file").addEventListener("change", async e=>{
      if(!configured){ setStatus("Najpierw skonfiguruj Supabase."); return; }
      const files=[...e.target.files]; if(!files.length)return;
      setStatus("Dodawanie zdjęć…");
      let ok=0;
      for(const file of files){
        if(!file.type.startsWith("image/")) continue;
        const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
        const path=`${Date.now()}-${crypto.randomUUID()}.${escapePath(ext)}`;
        const {error}=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});
        if(!error) ok++;
      }
      e.target.value="";
      setStatus(`Dodano ${ok} ${ok===1?"zdjęcie":"zdjęć"}.`);
      await loadPhotos();
    });

    document.getElementById("refresh").onclick=loadPhotos;
    document.getElementById("showqr").onclick=()=>{
      const box=document.getElementById("qrbox");
      box.style.display=box.style.display==="block"?"none":"block";
      if(box.style.display==="block" && !box.dataset.ready){
        new QRCode(document.getElementById("qrcode"),{text:location.href,width:220,height:220});
        box.dataset.ready="1";
      }
    };
    loadPhotos();
  </script>
</body>
</html>
